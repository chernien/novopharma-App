<ion-content [fullscreen]="true" class="ion-padding custom-bg">
  <ion-grid class="full-height">
    <ion-row class="ion-align-items-center ion-justify-content-center full-height">
      <ion-col size-md="6" size-lg="4">
        <ion-card class="custom-card">
          <ion-card-header class="ion-text-center">
            <ion-text>
              <h2>🚀 Bienvenue !</h2>
              <p>Connectez-vous pour accéder à votre espace</p>
            </ion-text>
          </ion-card-header>

          <ion-card-content>
            <div class="text-center">
              <ion-img src="../../assets/Invoice-rafiki.png" class="logo"></ion-img>
            </div>
            
            <ion-list>
              <ion-item>
                <ion-icon name="mail-outline" slot="start"></ion-icon>
                <ion-input type="email" placeholder="Email"></ion-input>
              </ion-item>
              <ion-item>
                <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
                <ion-input type="password" placeholder="Mot de passe"></ion-input>
              </ion-item>
            </ion-list>
            
            <div class="button-container">
              <ion-button expand="block" color="primary" (click)="onLogin()">🔑 Se connecter</ion-button>
              <p class="ion-text-center forgot-password">🔁 Mot de passe oublié ?</p>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
