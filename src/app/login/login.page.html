<ion-content [fullscreen]="true" class="ion-content-custom">
  <ion-grid class="grid-center">
    <ion-row class="ion-justify-content-center ion-align-items-center">
      <ion-col size="12" size-md="6" size-lg="4">
        <div class="login-container">
          <ion-card class="login-card">
            <ion-card-content class="login-card-content">
              <ion-img src="../assets/logo_NOVOPHARMA_H-1.png" class="logo"></ion-img>

              <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
                <div class="form-wrap">

                  <!-- 🔹 Champ Nom d'utilisateur -->
                  <ion-item class="ion-item-custom">
                    <ion-icon slot="start" name="person-outline" color="medium"></ion-icon>
                    <ion-input type="text" placeholder=" Nom d'utilisateur" formControlName="username"
                      [class.invalid]="loginForm.controls['username'].invalid && loginForm.controls['username'].touched"
                      aria-label="Nom d'utilisateur">
                    </ion-input>
                  </ion-item>

                  <!-- 🔹 Champ Mot de Passe avec Icône Eye -->
                  <ion-item class="ion-item-custom password-input">
                    <ion-icon slot="start" name="lock-closed" color="medium"></ion-icon>
                    <ion-input [type]="showPassword ? 'text' : 'password'" placeholder=" Mot de Passe"
                      formControlName="password"
                      [class.invalid]="loginForm.controls['password'].invalid && loginForm.controls['password'].touched"
                      aria-label="Mot de Passe">
                    </ion-input>
                    <ion-icon slot="end" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" 
                      class="password-toggle-icon" (click)="togglePasswordVisibility()">
                    </ion-icon>
                  </ion-item>

                </div>

                <div class="sign-btn-wrap">
                  <ion-button type="submit" shape="round" fill="solid" expand="full" class="sign-btn" [disabled]="isLoggingIn">
                    <ion-icon name="log-in"></ion-icon> Se connecter
                  </ion-button>
                </div>
              </form>

              <div class="ion-card-footer">
                <span>Copyright 2025 © Mediasoft. Tous droits réservés.</span>
              </div>
            </ion-card-content>
          </ion-card>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
