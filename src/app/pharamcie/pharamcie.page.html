<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
  <img src="../../assets/logo_NOVOPHARMA_H-1-mini.png" width="64" alt="Novopharma Logo"   class="logo-novopharma"

       style="cursor:pointer;" 
       (click)="animateLogo($event)" />
</ion-buttons>


    <ion-title class="title-header">Pharmacies</ion-title>

    <!-- 🔥 Regrouper TOUS les boutons à droite -->
    <ion-buttons slot="end" class="toolbar-buttons">

      <!-- Si utilisateur yosra-novo -->
      <!-- Si utilisateur yosra-novo ou admin-novo -->
<ion-button *ngIf="isYosra" (click)="goToDermos()">
  <ion-icon name="people-outline"></ion-icon>
  Dermos
</ion-button>

<!-- Sinon Check-in/Check-out -->
<ion-button *ngIf="!isYosra && !isCheckedIn" color="success" (click)="onCheckIn()">
  <ion-icon name="log-in-outline"></ion-icon>
  Check-in
</ion-button>

<ion-button *ngIf="!isYosra && isCheckedIn" color="danger" (click)="onCheckOut()">
  <ion-icon name="log-out-outline"></ion-icon>
  Check-out
</ion-button>


      <!-- Bouton logout toujours dispo -->
      <ion-button class="filter" fill="clear" (click)="logout()">
        <ion-icon name="exit-outline" color="dark"></ion-icon>
      </ion-button>

    </ion-buttons>
  </ion-toolbar>
</ion-header>



<ion-content>
  <!-- Barre de recherche améliorée -->
  <div class="search ion-padding">
    <ion-item lines="none" color="light">
      <ion-input placeholder="🔎 Rechercher une pharmacie..." [(ngModel)]="searchText" clear-input></ion-input>
    </ion-item>
  </div>

  <!-- Liste des pharmacies -->
  <ion-list inset="true" lines="none" class="pharmacie-list">
    <ion-item *ngFor="let pharmacie of clients | client:searchText" routerLink="/tabs/marque" (click)="selectPharmacy(pharmacie)"
      class="pharmacie-item">
      <ion-label>
        <h2 class="pharmacie-name"> {{ pharmacie?.ctIntitule }} </h2>
        <p class="pharmacie-address"># {{ pharmacie?.ctNum }}</p>
        <p class="pharmacie-address">📍 {{ pharmacie?.ctAdresse }}</p>
      </ion-label>
      <ion-icon name="chevron-forward-outline" slot="end" color="primary"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
